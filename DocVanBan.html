    <!-- Logic JavaScript xử lý Web Speech API (Đã sửa triệt để lỗi tải giọng & kẹt hàng đợi) -->
    <script>
        // Biến toàn cục giữ tham chiếu Utterance để ngăn trình duyệt tự ý thu gom rác (Garbage Collection) giữa chừng
        window.currentUtterance = null;

        document.addEventListener('DOMContentLoaded', () => {
            const hasSpeechSupport = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
            if (!hasSpeechSupport) {
                showToast('Trình duyệt của bạn không hỗ trợ tính năng đọc văn bản (Web Speech API). Vui lòng mở bằng Chrome, Edge hoặc Safari.', 'error');
            }

            const synth = hasSpeechSupport ? window.speechSynthesis : null;

            // Các phần tử DOM
            const textInput = document.getElementById('textInput');
            const voiceSelect = document.getElementById('voiceSelect');
            const refreshVoicesBtn = document.getElementById('refreshVoicesBtn');
            const refreshVoiceIcon = document.getElementById('refreshVoiceIcon');
            const voiceHint = document.getElementById('voiceHint');

            const rateRange = document.getElementById('rateRange');
            const pitchRange = document.getElementById('pitchRange');
            const volumeRange = document.getElementById('volumeRange');
            
            const rateValue = document.getElementById('rateValue');
            const pitchValue = document.getElementById('pitchValue');
            const volumeValue = document.getElementById('volumeValue');
            
            const charCount = document.getElementById('charCount');
            const wordCount = document.getElementById('wordCount');
            const progressText = document.getElementById('progressText');
            const speakingIndicator = document.getElementById('speakingIndicator');
            const statusText = document.getElementById('statusText');

            const liveCaptionBox = document.getElementById('liveCaptionBox');
            const currentChunkDisplay = document.getElementById('currentChunkDisplay');
            const progressBar = document.getElementById('progressBar');
            const percentText = document.getElementById('percentText');

            const playResumeBtn = document.getElementById('playResumeBtn');
            const playResumeLabel = document.getElementById('playResumeLabel');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const restartBtn = document.getElementById('restartBtn');
            
            const sampleBtn = document.getElementById('sampleBtn');
            const pasteBtn = document.getElementById('pasteBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resetSettingsBtn = document.getElementById('resetSettingsBtn');
            const themeToggle = document.getElementById('themeToggle');
            const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');

            // Biến quản lý trạng thái phát
            let voices = [];
            let textChunks = [];
            let currentChunkIndex = 0;
            let isPlaying = false;
            let isPaused = false;
            let manualStop = false;
            let nextChunkTimer = null;
            let watchdogTimer = null;
            let voicePollTimer = null;
            let sessionToken = 0;

            // 1. QUẢN LÝ DARK / LIGHT MODE & LƯU PREFERENCES
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');
            
            if (localStorage.getItem('tts_theme') === 'dark' || 
               (!localStorage.getItem('tts_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (sunIcon) sunIcon.classList.remove('hidden');
                if (moonIcon) moonIcon.classList.add('hidden');
            }

            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('tts_theme', isDark ? 'dark' : 'light');
                if (sunIcon) sunIcon.classList.toggle('hidden', !isDark);
                if (moonIcon) moonIcon.classList.toggle('hidden', isDark);
            });

            // Khôi phục thông số đã lưu
            if (localStorage.getItem('tts_rate')) {
                rateRange.value = localStorage.getItem('tts_rate');
                rateValue.textContent = `${parseFloat(rateRange.value).toFixed(1)}x`;
            }
            if (localStorage.getItem('tts_pitch')) {
                pitchRange.value = localStorage.getItem('tts_pitch');
                pitchValue.textContent = parseFloat(pitchRange.value).toFixed(1);
            }
            if (localStorage.getItem('tts_volume')) {
                volumeRange.value = localStorage.getItem('tts_volume');
                volumeValue.textContent = `${Math.round(volumeRange.value * 100)}%`;
            }

            // 2. CƠ CHẾ TẢI GIỌNG ĐỌC BẤT ĐỒNG BỘ + POLLING + FALLBACK MẶC ĐỊNH
            function renderVoiceOptions(voiceList) {
                const savedVoiceURI = localStorage.getItem('tts_voice');
                const currentSelection = voiceSelect.value;
                voiceSelect.innerHTML = '';

                // Luôn có sẵn tùy chọn Giọng mặc định của hệ thống để không bao giờ bị khóa
                const defaultOption = document.createElement('option');
                defaultOption.value = 'SYSTEM_DEFAULT_VI';
                defaultOption.textContent = '🇻🇳 Giọng mặc định của hệ thống (Tiếng Việt - vi-VN)';
                voiceSelect.appendChild(defaultOption);

                if (!voiceList || voiceList.length === 0) {
                    voiceSelect.value = 'SYSTEM_DEFAULT_VI';
                    voiceHint.innerHTML = 'Đang dùng <strong>Giọng mặc định của hệ thống (vi-VN)</strong>. Bạn có thể bấm <strong>Đọc ngay</strong> hoặc bấm <strong>Làm mới</strong> để quét thêm giọng.';
                    return false;
                }

                const viVoices = voiceList.filter(v => v.lang && v.lang.toLowerCase().includes('vi'));
                const otherVoices = voiceList.filter(v => !v.lang || !v.lang.toLowerCase().includes('vi'));

                if (viVoices.length > 0) {
                    const viGroup = document.createElement('optgroup');
                    viGroup.label = `🇻🇳 Giọng Tiếng Việt (${viVoices.length} giọng)`;
                    viVoices.forEach(voice => {
                        const option = document.createElement('option');
                        option.value = voice.voiceURI;
                        option.textContent = `${voice.name} (${voice.lang})`;
                        viGroup.appendChild(option);
                    });
                    voiceSelect.appendChild(viGroup);
                }

                if (otherVoices.length > 0) {
                    const otherGroup = document.createElement('optgroup');
                    otherGroup.label = `🌐 Ngôn ngữ khác (${otherVoices.length} giọng)`;
                    otherVoices.forEach(voice => {
                        const option = document.createElement('option');
                        option.value = voice.voiceURI;
                        option.textContent = `${voice.name} (${voice.lang})`;
                        otherGroup.appendChild(option);
                    });
                    voiceSelect.appendChild(otherGroup);
                }

                // Khôi phục hoặc tự chọn giọng Tiếng Việt tốt nhất
                const allValues = Array.from(voiceSelect.options).map(o => o.value);
                if (savedVoiceURI && allValues.includes(savedVoiceURI)) {
                    voiceSelect.value = savedVoiceURI;
                } else if (currentSelection && currentSelection !== 'SYSTEM_DEFAULT_VI' && allValues.includes(currentSelection)) {
                    voiceSelect.value = currentSelection;
                } else if (viVoices.length > 0) {
                    const preferred = viVoices.find(v => v.name.includes('HoaiMy') || v.name.includes('NamMinh') || v.name.includes('Google')) || viVoices[0];
                    voiceSelect.value = preferred.voiceURI;
                } else {
                    voiceSelect.value = 'SYSTEM_DEFAULT_VI';
                }

                voiceHint.innerHTML = viVoices.length > 0
                    ? `Đã tìm thấy <strong>${viVoices.length} giọng Tiếng Việt</strong>. Khuyên dùng <em>HoaiMy</em>, <em>NamMinh</em> hoặc <em>Google Tiếng Việt</em>.`
                    : `Không thấy gói giọng Tiếng Việt riêng, hệ thống sẽ tự dùng <strong>Giọng mặc định (vi-VN)</strong> để đọc.`;

                return true;
            }

            function startVoiceDiscovery(isManual = false) {
                if (!synth) return;

                if (voicePollTimer) {
                    clearInterval(voicePollTimer);
                    voicePollTimer = null;
                }

                if (isManual && refreshVoiceIcon) {
                    refreshVoiceIcon.classList.add('animate-spin');
                }

                let elapsed = 0;
                const intervalMs = 250;
                const maxDurationMs = 3000;

                const checkVoices = () => {
                    try {
                        const loaded = synth.getVoices();
                        if (loaded && loaded.length > 0) {
                            voices = loaded;
                            renderVoiceOptions(voices);
                            clearInterval(voicePollTimer);
                            voicePollTimer = null;
                            if (refreshVoiceIcon) refreshVoiceIcon.classList.remove('animate-spin');
                            if (isManual) {
                                showToast(`Đã cập nhật ${voices.length} giọng đọc từ thiết bị!`, 'info');
                            }
                            return true;
                        }
                    } catch (e) {
                        console.warn('Lỗi khi gọi getVoices():', e);
                    }
                    return false;
                };

                // Kiểm tra ngay lập tức lần đầu
                if (checkVoices()) return;

                // Polling mỗi 250ms trong tối đa 3 giây
                voicePollTimer = setInterval(() => {
                    elapsed += intervalMs;
                    const found = checkVoices();
                    if (!found && elapsed >= maxDurationMs) {
                        clearInterval(voicePollTimer);
                        voicePollTimer = null;
                        if (refreshVoiceIcon) refreshVoiceIcon.classList.remove('animate-spin');
                        // Sau 3s vẫn rỗng -> Mở khóa dùng giọng mặc định hệ thống vi-VN
                        renderVoiceOptions([]);
                        if (isManual) {
                            showToast('Trình duyệt không liệt kê danh sách giọng chi tiết, đã kích hoạt Giọng mặc định (vi-VN).', 'warning');
                        }
                    }
                }, intervalMs);
            }

            // Khởi chạy quét giọng khi mở trang & lắng nghe sự kiện onvoiceschanged
            renderVoiceOptions([]);
            startVoiceDiscovery(false);

            if (synth && typeof synth.onvoiceschanged !== 'undefined') {
                synth.onvoiceschanged = () => {
                    const loaded = synth.getVoices();
                    if (loaded && loaded.length > 0) {
                        voices = loaded;
                        renderVoiceOptions(voices);
                        if (voicePollTimer) {
                            clearInterval(voicePollTimer);
                            voicePollTimer = null;
                        }
                    }
                };
            }

            refreshVoicesBtn.addEventListener('click', () => {
                startVoiceDiscovery(true);
            });

            voiceSelect.addEventListener('change', () => {
                localStorage.setItem('tts_voice', voiceSelect.value);
                if (isPlaying && !isPaused) {
                    clearTimers();
                    manualStop = true;
                    synth.cancel();
                    setTimeout(() => {
                        manualStop = false;
                        speakCurrentChunk(sessionToken);
                    }, 60);
                }
            });

            // 3. CẬP NHẬT THÔNG SỐ THANH TRƯỢT & ĐẾM TỪ
            function updateStats() {
                const text = textInput.value;
                charCount.textContent = text.length.toLocaleString('vi-VN');
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                wordCount.textContent = words.toLocaleString('vi-VN');
            }

            updateStats();
            textInput.addEventListener('input', updateStats);

            rateRange.addEventListener('input', () => {
                rateValue.textContent = `${parseFloat(rateRange.value).toFixed(1)}x`;
                localStorage.setItem('tts_rate', rateRange.value);
            });

            pitchRange.addEventListener('input', () => {
                pitchValue.textContent = parseFloat(pitchRange.value).toFixed(1);
                localStorage.setItem('tts_pitch', pitchRange.value);
            });

            volumeRange.addEventListener('input', () => {
                volumeValue.textContent = `${Math.round(volumeRange.value * 100)}%`;
                localStorage.setItem('tts_volume', volumeRange.value);
            });

            resetSettingsBtn.addEventListener('click', () => {
                rateRange.value = 1.0;
                pitchRange.value = 1.0;
                volumeRange.value = 1.0;
                rateValue.textContent = '1.0x';
                pitchValue.textContent = '1.0';
                volumeValue.textContent = '100%';
                localStorage.removeItem('tts_rate');
                localStorage.removeItem('tts_pitch');
                localStorage.removeItem('tts_volume');
                showToast('Đã khôi phục tốc độ, cao độ và âm lượng về mặc định.', 'info');
            });

            // 4. THUẬT TOÁN CHIA NHỎ VĂN BẢN DÀI (< 175 KÝ TỰ / CÂU)
            function splitTextIntoChunks(text) {
                const rawParagraphs = text.split(/\n+/);
                const chunks = [];
                const maxChunkLength = 175;

                rawParagraphs.forEach(paragraph => {
                    const trimmed = paragraph.trim();
                    if (!trimmed) return;

                    const sentences = trimmed.match(/[^.!?;:]+[.!?;:]*\s*/g) || [trimmed];

                    sentences.forEach(sentence => {
                        const cleanSentence = sentence.trim();
                        if (!cleanSentence) return;

                        if (cleanSentence.length <= maxChunkLength) {
                            chunks.push(cleanSentence);
                        } else {
                            const subParts = cleanSentence.match(/[^,]+,*\s*/g) || [cleanSentence];
                            let currentPart = '';

                            subParts.forEach(part => {
                                if ((currentPart + part).length <= maxChunkLength) {
                                    currentPart += part;
                                } else {
                                    if (currentPart.trim()) chunks.push(currentPart.trim());
                                    if (part.length > maxChunkLength) {
                                        const words = part.split(/\s+/);
                                        let temp = '';
                                        words.forEach(w => {
                                            if ((temp + ' ' + w).length <= maxChunkLength) {
                                                temp = temp ? temp + ' ' + w : w;
                                            } else {
                                                if (temp) chunks.push(temp);
                                                temp = w;
                                            }
                                        });
                                        currentPart = temp;
                                    } else {
                                        currentPart = part;
                                    }
                                }
                            });
                            if (currentPart.trim()) chunks.push(currentPart.trim());
                        }
                    });
                });

                return chunks;
            }

            // 5. ĐIỀU KHIỂN ĐỌC VĂN BẢN (CHỐNG KẸT HÀNG ĐỢI & WATCHDOG CHUẨN XÁC)
            function clearTimers() {
                if (nextChunkTimer) {
                    clearTimeout(nextChunkTimer);
                    nextChunkTimer = null;
                }
                if (watchdogTimer) {
                    clearTimeout(watchdogTimer);
                    watchdogTimer = null;
                }
            }

            function updateUIState(state) {
                if (state === 'idle') {
                    playResumeBtn.disabled = false;
                    playResumeLabel.textContent = 'Đọc ngay';
                    pauseBtn.disabled = true;
                    stopBtn.disabled = true;
                    restartBtn.disabled = textChunks.length === 0;
                    speakingIndicator.classList.add('hidden');
                    speakingIndicator.classList.remove('flex');
                    liveCaptionBox.classList.add('hidden');
                    progressText.textContent = 'Sẵn sàng';
                } else if (state === 'speaking') {
                    playResumeBtn.disabled = true;
                    playResumeLabel.textContent = 'Đang đọc...';
                    pauseBtn.disabled = false;
                    stopBtn.disabled = false;
                    restartBtn.disabled = false;
                    speakingIndicator.classList.remove('hidden');
                    speakingIndicator.classList.add('flex');
                    liveCaptionBox.classList.remove('hidden');
                    statusText.textContent = 'Đang đọc...';
                } else if (state === 'paused') {
                    playResumeBtn.disabled = false;
                    playResumeLabel.textContent = 'Tiếp tục';
                    pauseBtn.disabled = true;
                    stopBtn.disabled = false;
                    restartBtn.disabled = false;
                    speakingIndicator.classList.remove('hidden');
                    speakingIndicator.classList.add('flex');
                    liveCaptionBox.classList.remove('hidden');
                    statusText.textContent = 'Đang tạm dừng';
                }
            }

            function advanceToNextChunk(activeToken) {
                if (activeToken !== sessionToken || !isPlaying || isPaused || manualStop) return;
                clearTimers();
                currentChunkIndex++;
                nextChunkTimer = setTimeout(() => {
                    speakCurrentChunk(activeToken);
                }, 60);
            }

            function speakCurrentChunk(activeToken) {
                if (!synth || activeToken !== sessionToken || !isPlaying || isPaused || manualStop) return;

                if (currentChunkIndex >= textChunks.length) {
                    stopSpeaking(true);
                    return;
                }

                clearTimers();
                const chunkText = textChunks[currentChunkIndex];
                
                const utterance = new SpeechSynthesisUtterance(chunkText);
                window.currentUtterance = utterance;

                const selectedURI = voiceSelect.value;
                if (selectedURI && selectedURI !== 'SYSTEM_DEFAULT_VI') {
                    const selectedVoice = voices.find(v => v.voiceURI === selectedURI);
                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                        utterance.lang = selectedVoice.lang || 'vi-VN';
                    } else {
                        utterance.lang = 'vi-VN';
                    }
                } else {
                    // Không gán utterance.voice, chỉ gán lang = 'vi-VN' để trình duyệt dùng giọng mặc định
                    utterance.lang = 'vi-VN';
                }

                const rate = parseFloat(rateRange.value) || 1.0;
                utterance.rate = rate;
                utterance.pitch = parseFloat(pitchRange.value) || 1.0;
                utterance.volume = parseFloat(volumeRange.value);

                // Cập nhật giao diện tiến độ & câu đang đọc
                const currentNum = currentChunkIndex + 1;
                const totalNum = textChunks.length;
                const percent = Math.round((currentNum / totalNum) * 100);
                
                progressText.textContent = `Câu ${currentNum} / ${totalNum}`;
                currentChunkDisplay.textContent = chunkText;
                progressBar.style.width = `${percent}%`;
                percentText.textContent = `${percent}% (Câu ${currentNum}/${totalNum})`;

                let hasFinishedChunk = false;

                utterance.onend = () => {
                    if (hasFinishedChunk || activeToken !== sessionToken || manualStop) return;
                    hasFinishedChunk = true;
                    advanceToNextChunk(activeToken);
                };

                utterance.onerror = (event) => {
                    if (hasFinishedChunk || activeToken !== sessionToken || manualStop) return;
                    const errCode = event && event.error ? event.error : 'unknown';
                    if (errCode === 'interrupted' || errCode === 'canceled') {
                        return;
                    }
                    hasFinishedChunk = true;
                    console.error('Lỗi phát âm thanh TTS:', errCode, event);
                    
                    if (errCode === 'not-allowed') {
                        showToast('Trình duyệt đang chặn tự động phát âm thanh (lỗi: not-allowed). Hãy chạm vào màn hình và bấm "Đọc ngay" lại.', 'error');
                        stopSpeaking(false);
                        return;
                    }
                    
                    showToast(`Lỗi đọc câu ${currentNum} (${errCode}). Đang tự động chuyển câu tiếp theo...`, 'warning');
                    advanceToNextChunk(activeToken);
                };

                // Watchdog tính dựa trên độ dài thực tế của câu (tối thiểu 5000ms, hoặc chunk.length * 120ms chia cho tốc độ)
                const safeTimeoutMs = Math.max(5000, Math.round((chunkText.length * 120) / Math.min(rate, 1.0)));
                watchdogTimer = setTimeout(() => {
                    if (!hasFinishedChunk && activeToken === sessionToken && isPlaying && !isPaused && !manualStop) {
                        // Chỉ ép chuyển tiếp nếu trình duyệt không còn đang đọc thực sự
                        if (!synth.speaking) {
                            console.warn('Watchdog kích hoạt: Tự động chuyển sang câu tiếp theo.');
                            hasFinishedChunk = true;
                            advanceToNextChunk(activeToken);
                        }
                    }
                }, safeTimeoutMs);

                try {
                    if (synth.paused) {
                        synth.resume();
                    }
                    synth.speak(utterance);
                } catch (err) {
                    showToast(`Không thể khởi chạy bộ đọc âm thanh: ${err.message}`, 'error');
                    stopSpeaking(false);
                }
            }

            function handlePlayOrResume() {
                if (!synth) {
                    showToast('Trình duyệt của bạn không hỗ trợ đọc văn bản.', 'error');
                    return;
                }

                // Nếu đang tạm dừng -> Tiếp tục đọc
                if (isPlaying && isPaused) {
                    isPaused = false;
                    updateUIState('speaking');
                    synth.resume();
                    setTimeout(() => {
                        if (isPlaying && !isPaused && !synth.speaking) {
                            speakCurrentChunk(sessionToken);
                        }
                    }, 150);
                    return;
                }

                startSpeakingFromBeginning();
            }

            function startSpeakingFromBeginning() {
                if (!synth) return;

                const rawText = textInput.value.trim();
                if (!rawText) {
                    showToast('Vui lòng nhập hoặc dán văn bản cần đọc trước nhé!', 'warning');
                    textInput.focus();
                    return;
                }

                clearTimers();
                manualStop = true;
                synth.cancel();

                textChunks = splitTextIntoChunks(rawText);
                if (textChunks.length === 0) return;

                sessionToken++;
                const currentToken = sessionToken;
                currentChunkIndex = 0;
                isPlaying = true;
                isPaused = false;
                updateUIState('speaking');

                // Đợi 50ms sau synth.cancel() để tránh bug Chrome/Edge nuốt lệnh speak()
                setTimeout(() => {
                    manualStop = false;
                    speakCurrentChunk(currentToken);
                }, 50);
            }

            function pauseSpeaking() {
                if (!synth) return;
                if (isPlaying && !isPaused) {
                    clearTimers();
                    isPaused = true;
                    synth.pause();
                    updateUIState('paused');
                }
            }

            function stopSpeaking(completed = false) {
                clearTimers();
                sessionToken++;
                manualStop = true;
                isPlaying = false;
                isPaused = false;
                window.currentUtterance = null;
                if (synth) {
                    synth.cancel();
                }
                updateUIState('idle');
                
                if (completed) {
                    progressText.textContent = '✅ Đã đọc xong hoàn toàn!';
                    showToast('Đã đọc xong toàn bộ văn bản!', 'info');
                }
                setTimeout(() => {
                    manualStop = false;
                }, 80);
            }

            // Gán sự kiện cho các nút điều khiển
            playResumeBtn.addEventListener('click', handlePlayOrResume);
            pauseBtn.addEventListener('click', pauseSpeaking);
            stopBtn.addEventListener('click', () => stopSpeaking(false));
            restartBtn.addEventListener('click', startSpeakingFromBeginning);

            window.addEventListener('beforeunload', () => {
                manualStop = true;
                if (synth) synth.cancel();
            });

            // 6. TÍNH NĂNG TẢI FILE HTML VỀ MÁY
            downloadHtmlBtn.addEventListener('click', () => {
                try {
                    const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Trinh_Doc_Van_Ban_Mien_Phi.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('Đã tải file HTML về máy! Bạn có thể mở file này bằng Edge hoặc Chrome bất cứ lúc nào.', 'info');
                } catch (err) {
                    showToast('Không thể tải file tự động. Bạn có thể nhấn Ctrl+S để lưu trang web này.', 'warning');
                }
            });

            // 7. CÁC NÚT TIỆN ÍCH NHANH (VĂN BẢN MẪU, DÁN, XÓA)
            sampleBtn.addEventListener('click', () => {
                stopSpeaking(false);
                textInput.value = `Xin chào! Đây là trình đọc văn bản tiếng Việt đã được nâng cấp chống lỗi dừng giữa chừng.

Đoạn thứ nhất: Hệ thống tự động chia nhỏ văn bản thành từng câu ngắn dưới 175 ký tự, giúp trình duyệt không bao giờ chạm ngưỡng giới hạn thời gian phát âm thanh.

Đoạn thứ hai: Khi đọc xong một câu, ứng dụng sẽ có một khoảng nghỉ tự nhiên ngắn trước khi chuyển sang câu tiếp theo, đồng thời lưu giữ bộ nhớ đệm an toàn để không bị ngắt quãng.

Đoạn thứ ba: Bạn có thể dán cả một chương truyện dài, bài báo hoặc tài liệu học tập vào đây để nghe xuyên suốt từ đầu đến cuối. Hãy bấm nút Tải file HTML ở góc trên bên phải để lưu công cụ này về máy nhé!`;
                updateStats();
                showToast('Đã chèn văn bản mẫu 4 đoạn. Bấm "Đọc ngay" để kiểm tra!', 'info');
            });

            pasteBtn.addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        stopSpeaking(false);
                        textInput.value = text;
                        updateStats();
                        showToast('Đã dán văn bản từ bộ nhớ tạm!', 'info');
                    } else {
                        showToast('Bộ nhớ tạm hiện đang trống.', 'warning');
                    }
                } catch (err) {
                    showToast('Trình duyệt chặn quyền đọc bộ nhớ tạm tự động. Bạn hãy nhấn Ctrl+V (hoặc chạm giữ -> Dán) vào ô văn bản nhé!', 'warning');
                    textInput.focus();
                }
            });

            clearBtn.addEventListener('click', () => {
                stopSpeaking(false);
                textInput.value = '';
                updateStats();
                textInput.focus();
            });

            // 8. HỆ THỐNG THÔNG BÁO TOAST (THAY THẾ ALERT)
            const toastBox = document.getElementById('toastBox');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');
            let toastTimeout;

            window.showToast = function(msg, type = 'info') {
                clearTimeout(toastTimeout);
                toastMessage.textContent = msg;
                
                toastBox.className = 'transform transition-all duration-300 rounded-xl p-4 border flex items-center justify-between shadow-sm';
                
                if (type === 'error') {
                    toastBox.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-800', 'dark:bg-rose-900/30', 'dark:border-rose-800', 'dark:text-rose-200');
                    toastIcon.textContent = '⚠️';
                } else if (type === 'warning') {
                    toastBox.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800', 'dark:bg-amber-900/30', 'dark:border-amber-800', 'dark:text-amber-200');
                    toastIcon.textContent = '💡';
                } else {
                    toastBox.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-800', 'dark:bg-blue-900/30', 'dark:border-blue-800', 'dark:text-blue-200');
                    toastIcon.textContent = 'ℹ️';
                }

                toastBox.classList.remove('hidden');
                toastTimeout = setTimeout(hideToast, 6000);
            };

            window.hideToast = function() {
                toastBox.classList.add('hidden');
            };
        });
    </script>
</body>
</html>
