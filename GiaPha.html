<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Phả - Bản Fix Lỗi Xem Ảnh & Crop</title>
    <style>
    :root { --line-color: #000000; --male-color: #3498db; --female-color: #e91e63; }
    body { font-family: "Arial", sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
    
    .toolbar { position: sticky; top: 0; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; z-index: 100; border: 1px solid #ddd; }
    .btn-tool { padding: 8px 12px; margin-right: 8px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; color: white; }

    /* ===== CÂY GIA PHẢ COMPACT - LAYOUT THEO ĐỘ RỘNG NHÁNH ===== */
    #wrapper {
        position: relative;
        width: 100%;
        height: calc(100vh - 125px);
        min-height: 500px;
        overflow: auto;
        cursor: grab;
        background:
            linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);
        background-size: 20px 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box;
    }
    #tree-container {
        position: relative;
        transform-origin: 0 0;
        margin: 0;
    }
    .family-canvas {
        position: relative;
        margin: 0;
    }
    .family-node {
        position: absolute;
        box-sizing: border-box;
        z-index: 5;
        pointer-events: none;
    }
    .family-node .node-card {
        pointer-events: auto;
    }
    .family-lines {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none !important;
        z-index: 1;
    }
    .family-lines line {
        stroke: var(--line-color);
        stroke-width: 2px;
        vector-effect: non-scaling-stroke;
    }

    /* Node nhỏ và đồng đều để nhiều thế hệ vẫn quan sát được */
    .node-card {
        border: 2px solid var(--line-color);
        padding: 4px 5px;
        display: block;
        border-radius: 5px;
        background: white;
        width: 96px;
        min-height: 54px;
        cursor: pointer;
        position: relative;
        z-index: 10;
        box-sizing: border-box;
        box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .node-card:hover {
        box-shadow: 0 3px 10px rgba(0,0,0,.16);
        transform: translateY(-1px);
    }
    .node-card.male { border-color: var(--male-color); border-width: 2px; }
    .node-card.female { border-color: var(--female-color); border-width: 2px; }
    
    .name {
        font-weight: bold;
        display: block;
        font-size: 12px;
        line-height: 15px;
        margin-bottom: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .info {
        font-size: 9px;
        color: #666;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .spouse-box {
        color: #e67e22;
        font-size: 10px;
        border-top: 1px dashed #ccc;
        margin-top: 3px;
        padding-top: 2px;
    }
    .spouse-item {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-top: 2px;
        max-width: 100%;
        overflow: hidden;
    }
    .spouse-avatar {
        width: 22px !important;
        height: 22px !important;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
    }
    .spouse-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 9px;
    }

    /* MODAL CHỈNH SỬA */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; }
    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; z-index: 201; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; width: 100%; margin-top: 5px; padding: 8px; }

    .zoom-controls {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 120;
        display: flex;
        gap: 5px;
        background: white;
        padding: 5px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .btn-zoom {
        width: 36px;
        height: 34px;
        margin: 0;
        padding: 0;
        background: #374151;
        font-size: 18px;
    }
    @media (max-width: 700px) {
        body { padding: 8px; }
        #wrapper { height: calc(100vh - 95px); }
        .node-card { width: 88px; }
        .family-node { width: 88px !important; }
        .spouse-add-row .spouse-add-btn {
            flex-basis: 40px;
            width: 40px;
        }
    }


    /* ===== Ô THÊM VỢ/CHỒNG GỌN VÀ CÂN ĐỐI ===== */
    .spouse-add-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        box-sizing: border-box;
    }
    .spouse-add-row input#new-spouse-name {
        flex: 1 1 auto;
        min-width: 0;
        width: auto;
        margin: 0;
        height: 36px;
        padding: 7px 9px;
        box-sizing: border-box;
    }
    .spouse-add-row .spouse-add-btn {
        flex: 0 0 42px;
        width: 42px;
        height: 36px;
        margin: 0;
        padding: 0;
        background: #f59e0b;
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        border-radius: 5px;
    }

    /* Tên trên node: ưu tiên tên gọi cuối khi màn hình/cây quá nhỏ */
    /* Trên cây luôn ưu tiên tên gọi cuối.
       Họ tên đầy đủ vẫn được lưu trong node.name và hiện trong menu thông tin. */
    .node-name-full {
        display: none;
    }
    .node-name-short {
        display: inline;
    }

    /* ===== MODAL: CHỈ HIỆN SAU KHI BẤM THÀNH VIÊN ===== */

    .modal-box {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        border-radius: 8px;
        z-index: 201;
        width: 300px;
        max-width: calc(100vw - 30px);
        max-height: calc(100vh - 30px);
        overflow-y: auto;
        box-shadow: 0 10px 25px rgba(0,0,0,.2);
        box-sizing: border-box;
    }
    #overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.5);
        z-index: 200;
    }
    #full-photo-view {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 300;
        background: rgba(0,0,0,.9);
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }
    #full-photo-view img {
        max-width: 90vw;
        max-height: 85vh;
        object-fit: contain;
    }
    .btn-close-photo {
        margin-top: 15px;
        background: white;
        color: #111;
        padding: 8px 18px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }


    #tree-container.compact-names .node-name-full {
        display: none;
    }
    #tree-container.compact-names .node-name-short {
        display: inline;
    }

    /* ===== ZOOM NHỎ: CHỈ GIỮ TÊN GỌI ===== */
    #tree-container.compact-names .node-card {
        min-height: 30px;
        height: 30px;
        padding: 5px 4px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #tree-container.compact-names .node-card .avatar,
    #tree-container.compact-names .node-card .info,
    #tree-container.compact-names .node-card .spouse-item,
    #tree-container.compact-names .node-card .spouse-box {
        display: none !important;
    }

    #tree-container.compact-names .node-card .name {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

</style>
</head>
<body>

<div class="toolbar">
    <button class="btn-tool" style="background:#8b5cf6" onclick="exportToJson()">💾 Lưu JSON</button>
    <button class="btn-tool" style="background:#4b5563" onclick="document.getElementById('import-file').click()">📂 Mở File</button>
    <input type="file" id="import-file" accept=".json" onchange="importFromJson(event)" style="display:none">
</div>

<div class="zoom-controls">
    <button class="btn-zoom" onclick="changeZoom(0.1)">+</button>
    <button class="btn-zoom" onclick="changeZoom(-0.1)">-</button>
    <button class="btn-zoom" style="font-size: 14px;" onclick="resetZoom()">1:1</button>
</div>

<div id="wrapper">
    <div class="tree" id="tree-container"></div>
</div>

<div class="overlay" id="overlay" onclick="closeAllModals()"></div>

<div id="modal-edit" class="modal-box" onclick="event.stopPropagation()">
    <h3 style="margin-top:0; text-align: center;">Thông tin thành viên</h3>
    <div style="text-align:center">
        <img id="preview-img" src="" class="avatar" style="width:90px; height:90px; cursor:pointer; border:2px solid #3b82f6" onclick="openFullView(this.src)">
        <p style="font-size:10px; color:#666; margin:2px 0;">(Bấm vào ảnh để phóng to)</p>
        <label style="display:inline-block; font-size: 11px; color: #3b82f6; cursor: pointer; text-decoration: underline; margin-bottom: 10px;">
            Đổi ảnh đại diện
            <input type="file" accept="image/*" style="display:none" onchange="initCropProcess(event, 'member')">
        </label>
    </div>

    <input type="text" id="m-name" placeholder="Họ và tên" title="Họ và tên đầy đủ">
    <select id="m-gender"><option value="male">Nam</option><option value="female">Nữ</option></select>
    <input type="text" id="m-info" placeholder="Ngày sinh / Thông tin">
    
    <div style="margin-top:10px; border-top: 1px solid #eee; padding-top:10px;">
        <p style="font-size:0.8em; font-weight:bold; margin:0 0 5px 0;">Vợ / Chồng:</p>
        <div id="spouse-list-ui"></div>
        <div class="spouse-add-row">
            <input type="text" id="new-spouse-name" placeholder="Tên phối ngẫu">
            <button class="spouse-add-btn" onclick="addSpouseAction()" title="Thêm vợ/chồng">+</button>
        </div>
    </div>
    <hr>
<button style="background:#8e44ad; width:100%; padding:8px; margin-bottom:5px;" onclick="addParentAction()">
    ⬆️ Thêm Bố/Mẹ (Tạo thế hệ tiền bối)
</button>
    <button style="background:#059669; width:100%; padding:10px" onclick="addChildAction()">+ Thêm Con</button>
    <button style="background:#2563eb; width:100%; padding:12px; margin-top:8px" onclick="saveChanges()">LƯU LẠI</button>
    <button style="background:#dc2626; width:100%; padding:5px; margin-top:10px; font-size:0.7em" onclick="deleteNodeAction()">Xóa người này</button>
</div>

<div id="modal-crop" class="modal-box" style="width:300px; text-align:center;" onclick="event.stopPropagation()">
    <h3 id="crop-title" style="margin:0; font-size: 1em;">Cắt ảnh</h3>
    <div id="crop-container" onpointerdown="startDraggingCrop(event)">
        <img id="crop-img" src="">
        <div class="crop-mask"></div>
    </div>
    <input type="range" id="crop-zoom" min="0.1" max="4" step="0.01" value="1" oninput="applyCropTransform()">
    <div style="display:flex; gap:10px; margin-top:10px;">
        <button style="background:#6b7280; flex:1; padding:10px" onclick="closeCrop()">Hủy</button>
        <button style="background:#10b981; flex:1; padding:10px" onclick="finishCrop()">Xác nhận</button>
    </div>
</div>

<div id="full-photo-view">
    <img id="full-img-src" src="">
    <div class="btn-close-photo" onclick="closeFullView()">ĐÓNG LẠI</div>
</div>

<script>
    let familyData = null;
    let activeId = null;
    let currentZoom = 1;
    let targetCropType = 'member'; // 'member' hoặc index phối ngẫu

    // ===== ZOOM + KÉO CÂY =====
    const wrapper = document.getElementById('wrapper');
    let isDraggingTree = false, dragStart = { x: 0, y: 0, sL: 0, sT: 0 };

    wrapper.onmousedown = (e) => {
        if (e.target.closest('.node-card, .toolbar, .zoom-controls, button, input, select, .modal-box')) return;
        isDraggingTree = true;
        wrapper.style.cursor = 'grabbing';
        dragStart = { x: e.pageX, y: e.pageY, sL: wrapper.scrollLeft, sT: wrapper.scrollTop };
    };
    window.onmousemove = (e) => {
        if (!isDraggingTree) return;
        wrapper.scrollLeft = dragStart.sL - (e.pageX - dragStart.x);
        wrapper.scrollTop = dragStart.sT - (e.pageY - dragStart.y);
    };
    window.onmouseup = () => {
        isDraggingTree = false;
        wrapper.style.cursor = 'grab';
    };

    function applyZoom() {
        const tree = document.getElementById('tree-container');
        tree.style.transform = `scale(${currentZoom})`;
        tree.style.transformOrigin = '0 0';

        // Khi zoom <= 65% chỉ thu gọn thêm ảnh/thông tin/vợ chồng.
        tree.classList.toggle('compact-names', currentZoom <= 0.65);
    }
    function changeZoom(v) {
        currentZoom = Math.max(0.2, Math.min(3, +(currentZoom + v).toFixed(2)));
        applyZoom();
    }
    function resetZoom() {
        currentZoom = 1;
        applyZoom();
    }

    // --- CROP LOGIC (FIXED) ---
    let cropState = { active: false, x: 0, y: 0, scale: 1, lastX: 0, lastY: 0 };
	// 1. Thêm hàm tạo Bố/Mẹ đè lên trên Gốc (Root)
function addParentAction() {
    const parentName = prompt("Nhập tên Bố/Mẹ của người này:");
    if (!parentName) return;

    // Tạo Cụ Thủy Tổ mới
    const newRoot = {
        id: "id_" + Date.now(),
        name: parentName,
        gender: "male",
        info: "Đời Tiền Bối",
        spouses: [],
        children: [ familyData ] // Đưa toàn bộ cây hiện tại làm con của người này
    };

    // Cập nhật lại gốc gia phả
    familyData = newRoot;
    render();
    closeModal();
}
    function initCropProcess(event, type) {
        const file = event.target.files[0]; if (!file) return;
        targetCropType = type;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('crop-img');
            img.src = e.target.result;
            img.onload = () => {
                cropState = { active: false, x: 0, y: 0, scale: 1, lastX: 0, lastY: 0 };
                document.getElementById('crop-zoom').value = 1;
                applyCropTransform();
                document.getElementById('modal-crop').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            };
        };
        reader.readAsDataURL(file);
    }

    function startDraggingCrop(e) {
        cropState.active = true;
        cropState.lastX = e.clientX - cropState.x;
        cropState.lastY = e.clientY - cropState.y;
        document.addEventListener('pointermove', moveDraggingCrop);
        document.addEventListener('pointerup', stopDraggingCrop);
        e.preventDefault();
    }

    function moveDraggingCrop(e) {
        if (!cropState.active) return;
        cropState.x = e.clientX - cropState.lastX;
        cropState.y = e.clientY - cropState.lastY;
        applyCropTransform();
    }

    function stopDraggingCrop() {
        cropState.active = false;
        document.removeEventListener('pointermove', moveDraggingCrop);
        document.removeEventListener('pointerup', stopDraggingCrop);
    }

    function applyCropTransform() {
        cropState.scale = document.getElementById('crop-zoom').value;
        document.getElementById('crop-img').style.transform = `translate(${cropState.x}px, ${cropState.y}px) scale(${cropState.scale})`;
    }

    function finishCrop() {
        const canvas = document.createElement('canvas'); canvas.width = 300; canvas.height = 300;
        const ctx = canvas.getContext('2d');
        const img = document.getElementById('crop-img');
        const ratio = 300 / 180;
        const offset = (250 - 180) / 2;
        ctx.drawImage(img, (cropState.x - offset) * ratio, (cropState.y - offset) * ratio, img.width * cropState.scale * ratio, img.height * cropState.scale * ratio);
        const b64 = canvas.toDataURL('image/jpeg', 0.8);
        const node = findNode(familyData, activeId);
        if (targetCropType === 'member') {
            node.img = b64; document.getElementById('preview-img').src = b64;
        } else {
            node.spouses[targetCropType].img = b64; refreshSpouseUI(node);
        }
        closeCrop();
    }

    // --- FULL VIEW LOGIC (FIXED) ---
    function openFullView(src) {
        if (!src || src.includes('placeholder')) return;
        document.getElementById('full-img-src').src = src;
        document.getElementById('full-photo-view').style.display = 'flex';
    }
    function closeFullView() { document.getElementById('full-photo-view').style.display = 'none'; }

    // --- DATA & RENDER ---
    async function initData() {
        const local = localStorage.getItem('giapha_v7_fixed');
        if (local) { familyData = JSON.parse(local); render(); }
        else {
            familyData = { id: "root", name: "Cụ Tổ", gender: "male", info: "Đời 1", img: "", spouses: [], children: [] };
            render();
        }
    }

    // ===== RENDER CÂY GIA PHẢ COMPACT =====
    // Tính độ rộng thật của từng nhánh rồi đặt node cha vào đúng tâm
    // của cụm con. Nhánh ít người sẽ không chiếm khoảng trống của nhánh khác.

    const LAYOUT = {
        nodeW: 96,
        nodeH: 58,
        gapX: 12,
        gapY: 64,
        sidePad: 24,
        topPad: 24
    };

    function getNodeHeight(node) {
        const spouses = node.spouses || [];
        return LAYOUT.nodeH + Math.min(spouses.length, 3) * 24;
    }

    function getSubtreeWidth(node) {
        const children = node.children || [];
        if (!children.length) return LAYOUT.nodeW;

        let total = 0;
        children.forEach((child, i) => {
            total += getSubtreeWidth(child);
            if (i < children.length - 1) total += LAYOUT.gapX;
        });
        return Math.max(LAYOUT.nodeW, total);
    }

    function getTreeHeight(node) {
        const children = node.children || [];
        if (!children.length) return getNodeHeight(node);

        let maxChild = 0;
        children.forEach(c => {
            maxChild = Math.max(maxChild, getTreeHeight(c));
        });
        return getNodeHeight(node) + LAYOUT.gapY + maxChild;
    }

    function layoutTree(node, left, top, lines, positions) {
        const subtreeW = getSubtreeWidth(node);
        const nodeW = LAYOUT.nodeW;
        const nodeH = getNodeHeight(node);
        const children = node.children || [];

        if (!children.length) {
            const x = left + (subtreeW - nodeW) / 2;
            positions.set(node.id, { x, y: top, w: nodeW, h: nodeH });
            return;
        }

        let childrenTotal = 0;
        children.forEach((child, i) => {
            childrenTotal += getSubtreeWidth(child);
            if (i < children.length - 1) childrenTotal += LAYOUT.gapX;
        });

        let childLeft = left + (subtreeW - childrenTotal) / 2;
        const childTop = top + nodeH + LAYOUT.gapY;

        children.forEach(child => {
            const cw = getSubtreeWidth(child);
            layoutTree(child, childLeft, childTop, lines, positions);
            childLeft += cw + LAYOUT.gapX;
        });

        const first = positions.get(children[0].id);
        const last = positions.get(children[children.length - 1].id);

        const center =
            ((first.x + first.w / 2) + (last.x + last.w / 2)) / 2;

        const x = center - nodeW / 2;
        positions.set(node.id, { x, y: top, w: nodeW, h: nodeH });

        const parentX = x + nodeW / 2;
        const parentBottom = top + nodeH;
        const junctionY = parentBottom + LAYOUT.gapY / 2;

        lines.push({
            x1: parentX, y1: parentBottom,
            x2: parentX, y2: junctionY
        });

        const firstCenter = first.x + first.w / 2;
        const lastCenter = last.x + last.w / 2;

        if (children.length > 1) {
            lines.push({
                x1: firstCenter, y1: junctionY,
                x2: lastCenter, y2: junctionY
            });
        }

        children.forEach(child => {
            const p = positions.get(child.id);
            const cx = p.x + p.w / 2;
            lines.push({
                x1: cx, y1: junctionY,
                x2: cx, y2: p.y
            });
        });
    }

    function createSvgLines(width, height, lines) {
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('class', 'family-lines');
        svg.setAttribute('width', width);
        svg.setAttribute('height', height);
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

        lines.forEach(l => {
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', l.x1);
            line.setAttribute('y1', l.y1);
            line.setAttribute('x2', l.x2);
            line.setAttribute('y2', l.y2);
            svg.appendChild(line);
        });

        return svg;
    }

    function render() {
        const container = document.getElementById('tree-container');
        container.innerHTML = '';

        if (!familyData) return;

        const positions = new Map();
        const lines = [];

        const treeW = getSubtreeWidth(familyData);
        const treeH = getTreeHeight(familyData);

        const canvasW = treeW + LAYOUT.sidePad * 2;
        const canvasH = treeH + LAYOUT.topPad * 2;

        const canvas = document.createElement('div');
        canvas.className = 'family-canvas';
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';

        layoutTree(
            familyData,
            LAYOUT.sidePad,
            LAYOUT.topPad,
            lines,
            positions
        );

        canvas.appendChild(createSvgLines(canvasW, canvasH, lines));

        function appendNode(node) {
            const p = positions.get(node.id);
            if (!p) return;

            const holder = document.createElement('div');
            holder.className = 'family-node';
            holder.style.left = p.x + 'px';
            holder.style.top = p.y + 'px';
            holder.style.width = p.w + 'px';

            const card = document.createElement('div');
            card.className = `node-card ${node.gender || 'male'}`;

            const sHtml = (node.spouses || []).map(s => `
                <div class="spouse-item">
                    <img src="${s.img || 'https://via.placeholder.com/30'}"
                         class="spouse-avatar">
                    <span>${escapeHtml(s.name || '')}</span>
                </div>
            `).join('');

            card.innerHTML = `
                <img src="${node.img || 'https://via.placeholder.com/60'}"
                     class="avatar"
                     style="width:34px;height:34px;object-fit:cover;border-radius:50%;">
                <span class="name">
                    <span class="node-name-short">${escapeHtml(getShortName(node.name || ''))}</span>
                </span>
                <span class="info">${escapeHtml(node.info || '')}</span>
                ${sHtml}
            `;

            card.addEventListener('mousedown', (e) => {
                e.stopPropagation();
            });

            card.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openEditModal(node.id);
            });

            holder.appendChild(card);
            canvas.appendChild(holder);

            (node.children || []).forEach(appendNode);
        }

        appendNode(familyData);
        container.appendChild(canvas);
        applyZoom();

        localStorage.setItem('giapha_v7_fixed', JSON.stringify(familyData));
    }

    function getShortName(name) {
        // "Nguyễn Văn Vượng" -> "Vượng"
        // "Phạm Ngọc Hân" -> "Hân"
        // Giữ nguyên tên nếu chỉ có một từ.
        const s = String(name || '').trim().replace(/\s+/g, ' ');
        if (!s) return '';
        const parts = s.split(' ');
        return parts[parts.length - 1];
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function openEditModal(id) {
        const node = findNode(familyData, id);
        if (!node) return;

        activeId = id;

        document.getElementById('m-name').value = node.name || '';
        document.getElementById('m-info').value = node.info || '';
        document.getElementById('m-gender').value = node.gender || 'male';
        document.getElementById('preview-img').src =
            node.img || 'https://via.placeholder.com/80';

        refreshSpouseUI(node);

        // Menu chỉ xuất hiện sau khi bấm đúng thành viên.
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('modal-edit').style.display = 'block';
    }

    function refreshSpouseUI(node) {
        const list = document.getElementById('spouse-list-ui'); list.innerHTML = "";
        (node.spouses || []).forEach((s, i) => {
            const d = document.createElement('div');
            d.style = "display:flex; align-items:center; gap:8px; background:#f9fafb; padding:5px; margin-bottom:5px; border-radius:4px; font-size:12px;";
            d.innerHTML = `<img src="${s.img || 'https://via.placeholder.com/30'}" style="width:30px; height:30px; border-radius:50%; cursor:pointer" onclick="openFullView(this.src)">
                           <span style="flex:1">${s.name}</span>
                           <button onclick="changeSpousePhoto(${i})" style="background:#3b82f6; padding:3px 6px; font-size:10px">Ảnh</button>
                           <button onclick="removeSpouse(${i})" style="background:#ef4444; padding:3px 6px; font-size:10px">X</button>`;
            list.appendChild(d);
        });
    }

    function changeSpousePhoto(idx) {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
        inp.onchange = (e) => initCropProcess(e, idx); inp.click();
    }

    function findNode(root, id) { if (root.id === id) return root; if (root.children) { for (let c of root.children) { let f = findNode(c, id); if (f) return f; } } return null; }
    function closeAllModals() {
        document.querySelectorAll('.modal-box, #full-photo-view')
            .forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
        activeId = null;
    }

    function closeCrop() {
        document.getElementById('modal-crop').style.display = 'none';

        // Nếu đang chỉnh thành viên thì trả overlay về trạng thái
        // tương ứng với modal chỉnh sửa.
        if (activeId && document.getElementById('modal-edit').style.display === 'block') {
            document.getElementById('overlay').style.display = 'block';
        } else {
            document.getElementById('overlay').style.display = 'none';
        }
    }
    function addSpouseAction() { const n = document.getElementById('new-spouse-name').value; if (!n) return; const node = findNode(familyData, activeId); node.spouses.push({ name: n, img: "" }); document.getElementById('new-spouse-name').value = ""; refreshSpouseUI(node); }
    function removeSpouse(idx) { findNode(familyData, activeId).spouses.splice(idx, 1); refreshSpouseUI(findNode(familyData, activeId)); }
    function addChildAction() { const node = findNode(familyData, activeId); if (!node.children) node.children = []; node.children.push({ id: "id_"+Date.now(), name: "Người mới", gender: "male", info: "", img: "", spouses: [], children: [] }); saveChanges(); }
    function deleteNodeAction() { if (activeId === 'root' || !confirm("Xóa người này?")) return; const rm = (p, id) => { if (!p.children) return; const idx = p.children.findIndex(c => c.id === id); if (idx !== -1) p.children.splice(idx, 1); else p.children.forEach(c => rm(c, id)); }; rm(familyData, activeId); render(); closeAllModals(); }
    function saveChanges() { const node = findNode(familyData, activeId); node.name = document.getElementById('m-name').value; node.info = document.getElementById('m-info').value; node.gender = document.getElementById('m-gender').value; render(); closeAllModals(); }
    function exportToJson() { const b = new Blob([JSON.stringify(familyData, null, 2)], { type: "application/json" }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = "GiaPha.json"; a.click(); }
    function importFromJson(e) { const r = new FileReader(); r.onload = (ev) => { familyData = JSON.parse(ev.target.result); render(); }; r.readAsText(e.target.files[0]); }

    window.onload = initData;
</script>
</body>
</html>
