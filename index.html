<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sơ Đồ Gia Tộc</title>
<style>
:root{--male:#3498db;--female:#e91e63;--line:#555;--bg:#f4f6f8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:var(--bg);overflow:hidden}
.toolbar{position:fixed;top:10px;left:10px;right:10px;z-index:1000;display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 3px 14px #0002}
.toolbar-title{font-weight:700;margin-right:5px}
.btn-tool{border:0;color:#fff;border-radius:6px;padding:8px 11px;font-weight:700;cursor:pointer}
.save{background:#8b5cf6}.open{background:#4b5563}.center{background:#059669}
.zoom{position:fixed;right:14px;bottom:14px;top:auto;z-index:1000;display:flex;align-items:center;gap:4px;padding:5px;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 2px 8px #0002}
.zoom button{width:34px;height:32px;border:0;border-radius:5px;background:#374151;color:#fff;font-size:18px;cursor:pointer}
#zoomPct{min-width:50px;text-align:center;font-size:12px;font-weight:bold}
#wrapper{position:absolute;inset:60px 0 0;overflow:auto;cursor:grab;background-image:radial-gradient(#dfe3e8 1px,transparent 1px);background-size:20px 20px}
#wrapper:active{cursor:grabbing}
#tree{position:relative;transform-origin:top left;margin:35px}
#lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.family-node{position:absolute;z-index:5}
.family-box{position:relative;display:flex;align-items:center;justify-content:center;min-width:145px;min-height:48px;padding:5px 7px;background:#fff;border:2px solid #777;border-radius:7px;box-shadow:none}
.person-row{position:relative;min-width:130px;padding:3px 7px;text-align:center;font-size:12px;line-height:15px;font-weight:700;cursor:pointer;border-radius:4px;white-space:normal;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;justify-content:center}
.person-years{display:block;margin-top:2px;font-size:9px;line-height:11px;font-weight:600;color:#777}
.spouse-extra{font-size:10px;color:#666;margin-top:3px;line-height:13px}
.person-row.male{color:#1769aa}.person-row.female{color:#c2185b}
.person-row:hover{background:#00000008}
.person-row+.person-row{border-left:1px solid #ddd}
.person-row.vertical{border-left:0;border-top:1px solid #ddd}
.family-box.vertical{
  flex-direction:column;
  padding:4px 7px;
  min-width:145px;
}
.family-box.vertical .person-row{
  width:100%;
  min-height:36px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.family-box.vertical .person-row+.person-row{
  border-left:0;
  border-top:1px solid #ddd;
}
.detail-modal{display:none;position:fixed;z-index:2200;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,95vw);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px #0005;padding:18px}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:2100}
.detail-head{display:flex;gap:18px;align-items:flex-start}
.detail-main-photo{width:150px;height:150px;object-fit:cover;border-radius:10px;background:#eee;border:3px solid #ddd;cursor:pointer}
.detail-info{flex:1}
.detail-info h2{margin:0 0 6px;font-size:21px}
.info-line{font-size:13px;color:#555;margin:5px 0}
.detail-spouses{margin-top:15px;border-top:1px solid #eee;padding-top:12px}
.spouse-grid{display:flex;gap:10px;flex-wrap:wrap}
.spouse-card{display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:9px;padding:7px;min-width:210px;background:#fafafa}
.spouse-card img{width:52px;height:52px;object-fit:cover;border-radius:7px;background:#eee}
.spouse-card .sname{font-size:12px;font-weight:700;overflow-wrap:anywhere}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:16px}
.menu-grid button,.modal-actions button{border:0;border-radius:7px;padding:10px;color:#fff;font-weight:700;cursor:pointer}
.blue{background:#2563eb}.green{background:#059669}.purple{background:#8e44ad}.red{background:#dc2626}.gray{background:#6b7280}.orange{background:#f59e0b}
.form-modal{display:none;position:fixed;z-index:2300;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;padding:18px;box-shadow:0 20px 60px #0005}
input,select{width:100%;padding:9px;margin:5px 0;border:1px solid #ccc;border-radius:6px}
.avatar{width:95px;height:95px;object-fit:cover;border-radius:8px;background:#eee}
.spouse-edit{display:flex;gap:6px;align-items:center;padding:6px;margin-bottom:5px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:7px}
.spouse-edit img{width:38px;height:38px;object-fit:cover;border-radius:6px}
.spouse-edit input{flex:1;margin:0}
.crop-modal{display:none;position:fixed;z-index:2500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,94vw);background:#fff;border-radius:12px;padding:16px;text-align:center}
#cropBox{position:relative;width:260px;height:260px;margin:10px auto;overflow:hidden;background:#111;border-radius:8px;touch-action:none;cursor:move}
#cropImg{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;pointer-events:none;user-select:none}
#fullPhoto{display:none;position:fixed;z-index:3000;inset:0;background:#000e;align-items:center;justify-content:center;flex-direction:column}
#fullPhoto img{max-width:94vw;max-height:82vh;object-fit:contain}
@media(max-width:600px){.toolbar-title{display:none}.btn-tool{font-size:11px;padding:7px 8px}.detail-head{flex-direction:column;align-items:center}.menu-grid{grid-template-columns:1fr}.family-box{min-width:135px}.person-row{min-width:120px}}

button[onclick="exportFamilySVG()"]{font-weight:800}

/* ===== KHUNG + TIÊU ĐỀ GIA PHẢ ===== */
.genealogy-frame{
  position:absolute;
  left:18px;
  top:18px;
  right:18px;
  bottom:18px;
  border:3px solid #a33;
  border-radius:4px;
  pointer-events:none;
  z-index:1;
}
.genealogy-frame:before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid #c66;
}
.genealogy-header{
  position:absolute;
  left:50%;
  top:38px;
  transform:translateX(-50%);
  z-index:2;
  width:min(650px,60%);
  text-align:center;
  pointer-events:none;
}
.genealogy-ribbon{
  position:relative;
  display:inline-block;
  min-width:420px;
  padding:13px 55px 12px;
  background:linear-gradient(#a51f1f,#7d1010);
  color:#ffe7a8;
  border:2px solid #d6a33a;
  border-radius:8px;
  box-shadow:none;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:700;
  letter-spacing:2px;
  font-size:23px;
}
.genealogy-ribbon:before,
.genealogy-ribbon:after{
  content:"";
  position:absolute;
  top:7px;
  width:48px;
  height:39px;
  background:#8b1515;
  border:2px solid #d6a33a;
  z-index:-1;
}
.genealogy-ribbon:before{
  left:-25px;
  transform:skewX(20deg);
}
.genealogy-ribbon:after{
  right:-25px;
  transform:skewX(-20deg);
}
.genealogy-subtitle{
  margin-top:6px;
  color:#8d1717;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:700;
  font-size:12px;
}
.genealogy-poem{
  position:absolute;
  right:48px;
  top:55px;
  z-index:2;
  width:270px;
  text-align:center;
  color:#6e4b30;
  font-family:"Noto Serif","Times New Roman",serif;
  font-size:14px;
  line-height:1.55;
  font-style:italic;
  pointer-events:none;
}
.genealogy-poem:before{
  content:"❝";
  display:block;
  font-size:26px;
  line-height:12px;
  color:#9a6a3a;
}
.genealogy-corner{
  position:absolute;
  z-index:2;
  color:#9a1d1d;
  font-size:18px;
  pointer-events:none;
}
.corner-tl{left:28px;top:25px}.corner-tr{right:28px;top:25px}
.corner-bl{left:28px;bottom:25px}.corner-br{right:28px;bottom:25px}

@media(max-width:900px){

  .genealogy-subtitle{font-size:9px}

}

<script>
const STORAGE_KEY="giapha_v7_fixed";
let familyData=null, activeId=null, zoom=1;
let cropType="member", crop={x:0,y:0,scale:1,down:false,sx:0,sy:0};

const tree=document.getElementById("tree"), wrapper=document.getElementById("wrapper");

function uid(){return "id_"+Date.now()+"_"+Math.floor(Math.random()*100000)}
function placeholder(name){
  const c=(name||"?").trim().charAt(0).toUpperCase();
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#e5e7eb"/><text x="50%" y="54%" text-anchor="middle" font-family="Arial" font-size="70" fill="#6b7280">${c}</text></svg>`
  );
}
function normalize(n){
  if(!n)return;
  n.id=n.id||uid();
  n.name=n.name||"Người chưa đặt tên";
  n.gender=n.gender||"male";
  n.info=n.info||"";
  n.birthYear=n.birthYear||"";
  n.deathYear=n.deathYear||"";
  n.img=n.img||"";
  n.spouses=Array.isArray(n.spouses)?n.spouses:[];
  n.children=Array.isArray(n.children)?n.children:[];
  n.spouses=n.spouses.map(s=>{
    if(typeof s==="string")s={name:s};
    s.name=s.name||"Phối ngẫu";
    s.gender=s.gender||(n.gender==="female"?"male":"female");
    s.info=s.info||"";
    s.birthYear=s.birthYear||"";
    s.deathYear=s.deathYear||"";
    s.img=s.img||"";
    return s;
  });
  n.children.forEach(normalize);
}
function yearText(person){
  const b=String(person.birthYear||"").trim();
  const d=String(person.deathYear||"").trim();
  if(b&&d)return b+"-"+d;
  if(b)return b;
  if(d)return "-"+d;
  return "";
}

function find(n,id){if(!n)return null;if(n.id===id)return n;for(const c of n.children||[]){const f=find(c,id);if(f)return f}return null}
function parentOf(n,id,p=null){if(!n)return null;if(n.id===id)return p;for(const c of n.children||[]){const f=parentOf(c,id,n);if(f)return f}return null}

function boxMode(n){
  // Luôn xếp người chính và toàn bộ vợ/chồng theo chiều dọc.
  // Người chính ở trên, từng vợ/chồng xếp lần lượt bên dưới.
  return "vertical";
}
function boxSize(n){
  const vertical=true; // Luôn xếp người chính và vợ/chồng trên - dưới.
  const count=1+(n.spouses||[]).length;
  const w=145;
  const rowH=40;
  return vertical
    ? {w,h:count*rowH+10+(count-1)}
    : {w:w*count,h:48};
}
function subtreeW(n){
  const g=boxSize(n);
  if(!n.children.length)return g.w;
  const cw=n.children.map(subtreeW).reduce((a,b)=>a+b,0)+(n.children.length-1)*22;
  return Math.max(g.w,cw);
}

const pos=new Map();
let totalW=0,totalH=0;
function layout(){
  pos.clear();
  if(!familyData)return;

  // Compact tree an toàn:
  // - Đóng gói các subtree theo contour ở từng tầng.
  // - Không dịch các con sau khi đã đóng gói (đây là nguyên nhân gây chồng ô ở v21).
  // - Thay vào đó, đặt ô cha vào chính giữa nhóm con.
  // - Vì contour của toàn subtree được giữ nguyên sau khi căn cha nên các nhánh
  //   anh/chị/em ở cấp trên vẫn được collision-check chính xác.
  const LEVEL_GAP=58;
  const SIBLING_GAP=16;
  const SIDE_PAD=55;
  const TOP_Y=230;

  const levels=[];
  function measure(n,d){
    const g=boxSize(n);
    levels[d]=Math.max(levels[d]||0,g.h);
    (n.children||[]).forEach(c=>measure(c,d+1));
  }
  measure(familyData,0);

  const ys=[];
  let yy=TOP_Y;
  levels.forEach((h,i)=>{
    ys[i]=yy;
    yy+=h+LEVEL_GAP;
  });
  totalH=yy+60;

  // contour[d] là biên trái/phải của toàn subtree ở độ sâu d,
  // tính từ tâm của node gốc của subtree.
  function makeTree(n){
    const g=boxSize(n);
    const node={
      n,
      w:g.w,
      h:g.h,
      cx:0,
      children:[],
      contour:[{left:-g.w/2,right:g.w/2}]
    };

    const kids=(n.children||[]).map(makeTree);
    node.children=kids;
    if(!kids.length)return node;

    // Đặt các subtree con lần lượt từ trái sang phải.
    // cx của mỗi child là tâm tương đối của child.
    let previousRight=null;
    for(const child of kids){
      let desired=child.w/2;

      if(previousRight===null){
        child.cx=desired;
      }else{
        // So sánh contour với tất cả các độ sâu giao nhau.
        let shift=desired;
        for(const prev of kids.slice(0,kids.indexOf(child))){
          const maxDepth=Math.min(prev.contour.length,child.contour.length);
          for(let d=0;d<maxDepth;d++){
            const need=
              (prev.cx+prev.contour[d].right)+SIBLING_GAP-
              child.contour[d].left;
            if(need>shift)shift=need;
          }
        }
        child.cx=shift;
      }
      previousRight=child.cx+child.contour[0].right;
    }

    // Đưa nhóm con sao cho tâm nhóm nằm tại 0 = tâm node cha.
    const groupLeft=kids[0].cx+kids[0].contour[0].left;
    const groupRight=kids[kids.length-1].cx+kids[kids.length-1].contour[0].right;
    const groupCenter=(groupLeft+groupRight)/2;

    // QUAN TRỌNG: không dịch children.
    // Đặt node cha ở giữa nhóm con bằng cách thay cx của node cha.
    node.cx=groupCenter;

    // Contour của subtree tính theo tâm node cha.
    const contour=[{left:node.cx-g.w/2,right:node.cx+g.w/2}];
    for(const child of kids){
      for(let d=0;d<child.contour.length;d++){
        const L=child.cx+child.contour[d].left;
        const R=child.cx+child.contour[d].right;
        const idx=d+1;
        if(!contour[idx])contour[idx]={left:L,right:R};
        else{
          contour[idx].left=Math.min(contour[idx].left,L);
          contour[idx].right=Math.max(contour[idx].right,R);
        }
      }
    }

    // Chuẩn hóa contour về tâm thực của node cha.
    for(const c of contour){
      c.left-=node.cx;
      c.right-=node.cx;
    }
    node.contour=contour;

    // Đồng thời chuẩn hóa tâm các con theo node cha.
    kids.forEach(k=>k.cx-=node.cx);
    node.cx=0;
    return node;
  }

  const root=makeTree(familyData);

  // Sau makeTree, root.cx = 0 và mọi child.cx là tương đối với root.
  const minX=root.contour.reduce((m,c)=>Math.min(m,c.left),0);
  const maxX=root.contour.reduce((m,c)=>Math.max(m,c.right),0);
  const shiftX=SIDE_PAD-minX;
  totalW=Math.ceil(maxX-minX+SIDE_PAD*2);

  function write(t,d,parentAbsCx){
    const absCx=parentAbsCx+t.cx;
    const x=absCx-t.w/2+shiftX;
    const y=ys[d];
    pos.set(t.n.id,{
      x,y,w:t.w,h:t.h,
      cx:x+t.w/2,
      bottom:y+t.h
    });
    t.children.forEach(c=>write(c,d+1,absCx));
  }
  write(root,0,0);
}

function drawLines(){
  const svg=document.getElementById("lines");svg.innerHTML="";
  function line(x1,y1,x2,y2){
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
    l.setAttribute("stroke","#555");l.setAttribute("stroke-width","2");l.setAttribute("stroke-linecap","square");svg.appendChild(l);
  }
  function rec(n){
    if(!n.children.length)return;
    const p=pos.get(n.id);
    const cs=n.children.map(c=>pos.get(c.id));
    if(!p||!cs.length)return;
    const childTop=Math.min(...cs.map(x=>x.y));
    const drop=18;
    const busY=Math.min(childTop-18,p.bottom+drop);
    // Luôn nối từ chính giữa đáy ô gia đình xuống thanh phân nhánh.
    line(p.cx,p.bottom,p.cx,busY);
    if(cs.length===1){
      line(cs[0].cx,busY,cs[0].cx,cs[0].y);
    }else{
      const minX=Math.min(...cs.map(x=>x.cx));
      const maxX=Math.max(...cs.map(x=>x.cx));
      line(minX,busY,maxX,busY);
      cs.forEach(c=>line(c.cx,busY,c.cx,c.y));
    }
    n.children.forEach(rec);
  }
  rec(familyData);
}

function moveSibling(direction){
  if(!activeId)return;

  // Di chuyển trong danh sách anh/chị/em cùng cha/mẹ.
  // Chỉ đổi vị trí node nên toàn bộ con/cháu và dữ liệu của node đi theo.
  const p=parentOf(familyData,activeId);

  if(!p){
    alert("Người này đang là Cụ Tổ/gốc gia phả, không có anh/chị/em để di chuyển.");
    return;
  }

  const index=p.children.findIndex(c=>c.id===activeId);
  if(index<0)return;

  const target=index+direction;

  if(target<0){
    alert("Người này đã ở vị trí đầu tiên (sinh trước nhất) trong các anh/chị/em.");
    return;
  }

  if(target>=p.children.length){
    alert("Người này đã ở vị trí cuối cùng trong các anh/chị/em.");
    return;
  }

  const temp=p.children[index];
  p.children[index]=p.children[target];
  p.children[target]=temp;

  render();

  // Giữ nguyên người vừa di chuyển là người đang được chọn.
  const moved=find(familyData,activeId);
  if(moved){
    setTimeout(()=>showDetail(moved,moved),0);
  }
}

function deletePerson(){
  if(!activeId)return;
  if(familyData.id===activeId){
    alert("Không thể xóa người gốc. Nếu muốn bỏ người gốc, hãy thêm thế hệ tiền bối trước.");
    return;
  }
  const n=find(familyData,activeId);
  if(!n)return;
  if(!confirm("Xóa "+n.name+"?\n\nCác con của người này sẽ được nối trực tiếp vào cha/mẹ hiện tại để không mất dữ liệu."))return;
  const p=parentOf(familyData,activeId);
  if(p){
    const index=p.children.findIndex(c=>c.id===activeId);
    if(index>=0){
      const promoted=Array.isArray(n.children)?n.children:[];
      // Thay B bằng toàn bộ các con của B, giữ nguyên toàn bộ cây bên dưới.
      p.children.splice(index,1,...promoted);
    }
  }
  activeId=null;
  render();
  closeAll();
}

function exportJSON(){
  if(!familyData){
    alert("Chưa có dữ liệu gia phả để xuất.");
    return;
  }

  // Tên file có ngày + giờ theo thời gian trên thiết bị.
  // Ví dụ: GiaPha_2026-09-22_09-25-30.json
  const now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const timestamp=
    now.getFullYear()+"-"+
    pad(now.getMonth()+1)+"-"+
    pad(now.getDate())+"_"+
    pad(now.getHours())+"-"+
    pad(now.getMinutes())+"-"+
    pad(now.getSeconds());

  const b=new Blob(
    [JSON.stringify(familyData,null,2)],
    {type:"application/json;charset=utf-8"}
  );
  const a=document.createElement("a");
  const url=URL.createObjectURL(b);

  a.href=url;
  a.download="GiaPha_"+timestamp+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  try{
    const canvas=await html2canvas(stage,{
      backgroundColor:"#ffffff",

      allowTaint:false,
      logging:false,
      imageTimeout:15000,

      y:0,
      width:width,
      height:height,
      scrollX:0,
      scrollY:0,
      windowWidth:width,
      windowHeight:height
    });

    // Tạo canvas trắng độc lập để tránh alpha/ghost ở vùng ngoài cây.
    const cleanCanvas=document.createElement("canvas");
    cleanCanvas.width=canvas.width;
    cleanCanvas.height=canvas.height;

    const ctx=cleanCanvas.getContext("2d",{alpha:false});
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,cleanCanvas.width,cleanCanvas.height);
    ctx.drawImage(canvas,0,0);

    const link=document.createElement("a");
    link.download="GiaPha.png";
    link.href=cleanCanvas.toDataURL("image/png");
    document.body.appendChild(link);
    link.click();
    link.remove();

  }catch(e){
    console.error("PNG export:",e);
    alert("Xuất PNG không thành công. Bạn có thể dùng 'Xuất SVG/Corel' để xuất vector.");
  }finally{
    stage.remove();
  }
}

/* ===================== XUẤT SVG VECTOR CHO COREL ===================== */
function exportFamilySVG(){
  /*
    SVG là vector: chữ, đường nối và khung không bị vỡ khi phóng rất lớn.
    CorelDRAW có thể mở/import SVG để tiếp tục chỉnh sửa.
  */
  normalize(familyData);
  layout();

  const W=Math.ceil(totalW);
  const H=Math.ceil(totalH);

  const esc=s=>String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");

  let out=[];
  out.push(`<?xml version="1.0" encoding="UTF-8"?>`);
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`);
  out.push(`<rect width="100%" height="100%" fill="#ffffff"/>`);
  out.push(`<rect x="18" y="18" width="${W-36}" height="${H-36}" rx="4" fill="none" stroke="#a33" stroke-width="3"/>`);
  out.push(`<rect x="26" y="26" width="${W-52}" height="${H-52}" rx="2" fill="none" stroke="#c66" stroke-width="1"/>`);
  out.push(`<style>
    .box{fill:#fff;stroke:#777;stroke-width:2}
    .male{fill:#1769aa}
    .female{fill:#c2185b}
    .name{font-family:Arial,sans-serif;font-size:12px;font-weight:700}
    .year{font-family:Arial,sans-serif;font-size:9px;font-weight:600;fill:#777}
    .title{font-family:Georgia,"Times New Roman",serif;font-size:23px;font-weight:700;letter-spacing:2px;fill:#ffe7a8}
    .subtitle{font-family:Georgia,"Times New Roman",serif;font-size:12px;font-weight:700;fill:#8d1717}
    .poem{font-family:Georgia,"Times New Roman",serif;font-size:14px;font-style:italic;fill:#6e4b30}
  </style>`);
  const titleX=W/2;
  out.push(`<rect x="${titleX-325}" y="38" width="650" height="60" rx="8" fill="#8b1515" stroke="#d6a33a" stroke-width="2"/>`);
  out.push(`<text x="${titleX}" y="75" text-anchor="middle" class="title">SƠ ĐỒ GIA TỘC</text>`);
  out.push(`<text x="${titleX}" y="116" text-anchor="middle" class="subtitle">Cội nguồn • Gia tộc • Tổ tiên</text>`);
  const poemX=W-175;
  out.push(`<text x="${poemX}" y="65" text-anchor="middle" class="poem">Con người có tổ có tông</text>`);
  out.push(`<text x="${poemX}" y="87" text-anchor="middle" class="poem">Như cây có cội, như sông có nguồn</text>`);

  // Đường nối.
  function line(x1,y1,x2,y2){
    out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#555" stroke-width="2"/>`);
  }
  function drawConnect(n){
    if(!n.children.length)return;
    const p=pos.get(n.id);
    const cs=n.children.map(c=>pos.get(c.id));
    const mid=p.bottom+(cs[0].y-p.bottom)/2;
    line(p.cx,p.bottom,p.cx,mid);
    if(cs.length>1)line(Math.min(...cs.map(x=>x.cx)),mid,Math.max(...cs.map(x=>x.cx)),mid);
    cs.forEach(c=>line(c.cx,mid,c.cx,c.y));
    n.children.forEach(drawConnect);
  }
  drawConnect(familyData);

  function textParts(person,x,y,w){
    const center=x+w/2;
    const color=person.gender==="female"?"#c2185b":"#1769aa";
    const name=esc(person.name);
    const years=esc(yearText(person));
    out.push(`<text x="${center}" y="${y+20}" text-anchor="middle" class="name ${person.gender==="female"?"female":"male"}" fill="${color}">${name}</text>`);
    if(years)out.push(`<text x="${center}" y="${y+34}" text-anchor="middle" class="year">${years}</text>`);
  }

  function drawNode(n){
    const p=pos.get(n.id);
    const vertical=boxMode(n)==="vertical";
    out.push(`<rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7" ry="7"/>`);

    const people=[n,...(n.spouses||[])];
    const eachW=145;
    if(vertical){
      const rowH=37;
      people.forEach((person,i)=>{
        const yy=p.y+i*rowH;
        textParts(person,p.x,yy,p.w);
        if(i>0)line(p.x+10,yy,p.x+p.w-10,yy);
      });
    }else{
      people.forEach((person,i)=>{
        const xx=p.x+i*145;
        textParts(person,xx,p.y,145);
        if(i>0)line(xx,p.y+6,xx,p.y+p.h-6);
      });
    }
    n.children.forEach(drawNode);
  }

  drawNode(familyData);
  out.push("</svg>");

  const blob=new Blob([out.join("")],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="GiaPha_Corel.svg";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function loadHtml2Canvas(){
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.async=true;
    s.onload=resolve;
    s.onerror=reject;
    document.head.appendChild(s);
  });
}

const REMOTE_JSON_URL="https://raw.githubusercontent.com/hoangminhhp234/GiaPha/refs/heads/main/GiaPha.json";

async function loadInitialFamilyData(){
  // Ưu tiên dữ liệu mới nhất trên GitHub.
  // Nếu không có mạng/GitHub lỗi thì dùng bản localStorage.
  try{
    const response=await fetch(REMOTE_JSON_URL);
    if(!response.ok)throw new Error("HTTP "+response.status);

    const data=await response.json();
    if(!data || typeof data!=="object")throw new Error("JSON không hợp lệ");

    familyData=data;
    normalize(familyData);

    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(familyData));
    }catch(e){}

    render();
    setTimeout(centerTree,100);
    return true;
  }catch(err){
    console.warn("Không tải được GiaPha.json từ GitHub:",err);

    try{
      familyData=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    }catch(e){
      familyData=null;
    }

    if(!familyData){
      familyData={
        id:"root",
        name:"Cụ Tổ",
        gender:"male",
        birthYear:"",
        deathYear:"",
        info:"Đời 1",
        img:"",
        spouses:[],
        children:[]
      };
    }

    normalize(familyData);
    render();
    setTimeout(centerTree,100);
    return false;
  }
}

window.onload=async()=>{
  await loadInitialFamilyData();
  startNoticeTimer();
}
